<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details — Gourav Sharma</title>
  <meta name="description" content="A full-stack project case study by Gourav Sharma.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <nav aria-label="Primary navigation">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="Gourav Sharma, home"><img src="assets/images/logo.png" alt="" class="brand-logo"></a>
      <div class="navlinks">
        <a href="index.html#about">About</a><a href="index.html#skills">Skills</a><a href="projects.html" class="active">Projects</a><a href="index.html#contact">Contact</a>
      </div>
      <div class="nav-actions">
        <a class="nav-cta hide-mobile" href="index.html#contact">Let&apos;s talk <span aria-hidden="true">↗</span></a>
        <button class="hamburger" id="mobile-menu-btn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-menu"></button>
      </div>
    </div>
    <div class="mobile-menu" id="mobile-menu"><a href="index.html#about">About</a><a href="index.html#skills">Skills</a><a href="projects.html">Projects</a><a href="index.html#contact">Contact</a></div>
  </nav>

  <main id="app"></main>

  <footer>
    <div class="wrap">
      <p>© <span id="year"></span> Gourav Sharma. Designed and built in Jaipur.</p>
      <div class="fsocials">
        <a href="mailto:gouravns111@gmail.com" aria-label="Email">@</a>
        <a href="https://www.linkedin.com/in/gourav-sharma-4919862a7" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">in</a>
        <a href="https://github.com/GouravSharma26" target="_blank" rel="noopener noreferrer" aria-label="GitHub">gh</a>
      </div>
    </div>
  </footer>

  <script src="js/projects-data.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const project = window.PROJECTS.find(item => item.id === new URLSearchParams(window.location.search).get('id'));
    const app = document.getElementById('app');
    const accentVar = {teal:'var(--teal)', amber:'var(--amber)', violet:'var(--violet)', rose:'var(--rose)'};

    if (!project) {
      app.innerHTML = `<div class="wrap not-found"><span class="eyebrow">404 · Lost commit</span><h1>Project not found.</h1><p>The link may be incomplete or the project has moved.</p><a class="btn btn-primary" href="projects.html">Back to all projects</a></div>`;
    } else {
      const initials = project.title.split(' ').map(word => word[0]).slice(0,2).join('').toUpperCase();
      const target = project.live || project.repo;
      document.title = `${project.title} — Gourav Sharma`;
      app.innerHTML = `
        <div class="wrap detail-head"><a class="back-link" href="projects.html"><span aria-hidden="true">←</span> All projects</a></div>
        <article class="wrap detail-grid">
          <div>
            <div class="detail-tagline mono">Case study · ${project.live ? 'deployed product' : 'source available'}</div>
            <h1 class="detail-title">${project.title}</h1>
            <p class="detail-desc">${project.description}</p>
            <div class="meta-row">
              <div class="meta-item"><div class="k">Timeline</div><div class="v">${project.date || 'Independent build'}</div></div>
              <div class="meta-item"><div class="k">Availability</div><div class="v">${project.live ? 'Live & open source' : 'Open source'}</div></div>
            </div>
            <div class="stack-list"><h3>Built with</h3><div class="tech-row">${project.tech.map(tech => `<span>${tech}</span>`).join('')}</div></div>
            <div class="action-row">
              <a class="btn btn-primary" href="${project.repo}" target="_blank" rel="noopener noreferrer">View source <span aria-hidden="true">↗</span></a>
              ${project.live ? `<a class="btn btn-ghost" href="${project.live}" target="_blank" rel="noopener noreferrer">Visit live site <span aria-hidden="true">↗</span></a>` : ''}
            </div>
          </div>
          <a class="preview-box" href="${target}" target="_blank" rel="noopener noreferrer" aria-label="${project.live ? 'Open live project' : 'Open source repository'} for ${project.title}">
            <div class="thumb" style="--glow:${accentVar[project.accent] || 'var(--teal)'}"><div class="grid-bg"></div><div class="glow"></div><span class="mono-tag">Full-stack build</span><div class="initials">${initials}</div></div>
            <div class="cta-strip"><span class="label">${project.live ? 'Experience the live build' : 'Explore the repository'}</span><span class="arrow" aria-hidden="true">↗</span></div>
          </a>
        </article>`;
    }
  </script>
  <script src="js/site-common.js"></script>
</body>
</html>
